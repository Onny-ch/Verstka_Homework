          <div class="col-1"></div>
          <div class="col-4 border rounded-3">
            <form class="row g-3">
              <div class="mb-1">
                <label for="inputName" class="form-label mt-2">Имя</label>
                <input type="name" class="form-control" id="inputName" placeholder="Василий">
              </div>
              <div class="mb-1">
                <label for="inputEmail" class="form-label">Почта</label>
                <input type="password" class="form-control" id="inputEmail" placeholder="example@gmail.com">
              </div>
              <div class="mb-1">
                <label for="inputMessage" class="form-label">Сообщение</label>
                <textarea class="form-control" id="inputMessage" rows="3"></textarea>
              </div>
              <div class="col-auto">
                <button type="submit" class="btn btn-primary mb-2">Отправить</button>
              </div>
            </form>
          </div>
          <div class="col-1"></div>
          <div class="col-5">
            <p class="text fs-4 fw-bold mb-0">Наши контакты</p>
            <p class="text mt-4 mb-0">今日も一日、頑張ろう！</p>
